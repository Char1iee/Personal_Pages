<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A rose, gathered from a thousand little lights." />
    <title>For Delany</title>
    <link rel="stylesheet" href="qixi.css" />
  </head>
  <body>
    <audio id="love-song" src="bg_music.mp3" loop preload="auto"></audio>
    <button id="music-control" class="music-control" type="button" aria-label="Play our song" aria-pressed="false">
      <span aria-hidden="true">♫</span><span id="music-label">Play our song</span>
    </button>
    <main>
      <section class="scene">
        <canvas id="bouquet" aria-label="A softly swirling particle rose"></canvas>
        <section class="message" aria-label="Dedication">
          <p class="eyebrow">A thousand little moments</p>
          <h1>For Delany</h1>
          <p>A rose, gathered from a thousand little lights.</p>
        </section>
      </section>
      <section class="memories" aria-labelledby="memories-title">
        <p class="eyebrow">Our little gallery</p>
        <h2 id="memories-title">Moments with you</h2>
        <p class="memory-intro">Every picture is one more reason I am grateful that you are in my life.</p>
        <div class="photo-grid">
          <figure class="photo-card photo-card--tall"><img src="nosubject/IMG_5088.JPG" alt="Delany and Charlie smiling at the beach" loading="eager"><figcaption>The sea, the sky, and you.</figcaption></figure>
          <figure class="photo-card"><img src="nosubject/IMG_4248.JPG" alt="A handwritten love note for Delany" loading="lazy"><figcaption>Love you, Delany.</figcaption></figure>
          <figure class="photo-card"><img src="nosubject/IMG_5152.JPG" alt="Delany and Charlie embracing at the beach" loading="lazy"><figcaption>My favorite place is beside you.</figcaption></figure>
          <figure class="photo-card photo-card--wide"><img src="nosubject/IMG_5203.JPG" alt="Delany and Charlie sharing a sunny moment" loading="lazy"><figcaption>More adventures, always.</figcaption></figure>
          <figure class="photo-card"><img src="nosubject/IMG_5116.JPG" alt="Delany and Charlie together at dinner" loading="lazy"><figcaption>Every little moment.</figcaption></figure>
          <figure class="photo-card"><img src="nosubject/IMG_5165.JPG" alt="A close selfie of Delany and Charlie" loading="lazy"><figcaption>You make everything brighter.</figcaption></figure>
          <figure class="photo-card photo-card--wide"><img src="nosubject/Live_20260627234101202.JPG" alt="Delany and Charlie at the beach" loading="lazy"><figcaption>Us, in all our favorite places.</figcaption></figure>
          <figure class="photo-card"><img src="nosubject/dji_export_20260516_photo_0009.JPG" alt="Delany and Charlie smiling together outdoors" loading="lazy"><figcaption>To many more memories.</figcaption></figure>
        </div>
      </section>
    </main>
    <script src="qixi.js"></script>
  </body>
</html>
